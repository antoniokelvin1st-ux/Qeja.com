<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>QEJA Admin</title>
  <style>
    :root{--ink:#25271f;--orange:#ee5c24;--paper:#fbfaf7;--sand:#f4f0e7;--line:#ddd6ca}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font:14px Arial,sans-serif}.login{max-width:450px;margin:12vh auto;padding:28px}.brand{font-weight:800;font-size:28px;letter-spacing:-1px}.brand i{color:var(--orange)}.card{margin-top:25px;background:var(--paper);padding:35px}h1,h2{font-family:Georgia,serif;margin:0 0 12px}h1{font-size:46px}p{line-height:1.6;color:#5f6059}label{display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input,select{width:100%;padding:12px;border:1px solid var(--line);background:#fff;margin-top:6px}button{cursor:pointer;border:0;padding:13px 17px;font-weight:700}.primary{background:var(--orange);color:#fff;width:100%;margin-top:14px}.error{color:#b33418;font-size:12px}.app{display:none}.top{height:74px;background:var(--paper);padding:0 7vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.top button{background:none;text-decoration:underline;font-size:12px}.main{max-width:1000px;margin:auto;padding:55px 25px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px}.head .primary{width:auto}.section{background:var(--paper);margin-top:32px;padding:25px}.product{display:grid;grid-template-columns:68px 1fr auto;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product img{width:68px;height:58px;object-fit:cover}.product b,.product small{display:block}.product small{color:#777;margin-top:5px}.delete{background:none;color:#b33418;font-size:12px}.social{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.notice{font-size:12px;color:#777}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modal .card{margin:0;width:min(500px,100%)}.modal-head{display:flex;justify-content:space-between}.modal-head button{background:none;font-size:22px;padding:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.social,.two{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.product{grid-template-columns:55px 1fr}.product img{width:55px}.product .delete{grid-column:2;justify-self:start}}
  </style>
</head>
<body>
  <section class="login" id="login"><div class="brand">QEJA<i>.</i></div><form class="card" id="loginForm"><h1>Admin</h1><p>Manage your QEJA furniture catalogue.</p><label>Passcode<input id="pass" type="password" required></label><button class="primary">Log in</button><div class="error" id="error"></div></form></section>
  <main class="app" id="app"><header class="top"><div class="brand">QEJA<i>.</i></div><button id="logout">Log out</button></header><div class="main"><div class="head"><div><h1>Catalogue</h1><p>Add, edit, or remove furniture.</p></div><button class="primary" id="add">Add furniture</button></div><section class="section"><h2>Published furniture</h2><div id="products"></div></section><section class="section"><h2>Social links</h2><div class="social"><label>Instagram<input id="instagram" placeholder="https://instagram.com/..."></label><label>Facebook<input id="facebook" placeholder="https://facebook.com/..."></label><label>TikTok<input id="tiktok" placeholder="https://tiktok.com/@..."></label></div><button class="primary" id="saveSocial">Save social links</button></section></div></main>
  <div class="modal" id="modal"><form class="card" id="form"><div class="modal-head"><h2 id="formTitle">Add furniture</h2><button type="button" id="close">×</button></div><input id="id" type="hidden"><label>Name<input id="name" required></label><div class="two"><label>Price (KSh)<input id="price" type="number" min="0" required></label><label>Category<select id="category"><option value="qeja">QEJA Designs</option><option value="pallet">Pallet collection</option><option value="seating">Seating</option><option value="storage">Storage</option></select></label></div><label>Product photo<input id="photo" type="file" accept="image/*"></label><p class="notice">Choose a new photo only when adding a product or replacing its current photo.</p><button class="primary" id="publish">Publish</button><div class="error" id="uploadError"></div></form></div>
  <script>
    const seed=[];let items=JSON.parse(localStorage.getItem('qeja-products')||'null')||seed,oldImage='';const $=s=>document.querySelector(s);
    const save=()=>localStorage.setItem('qeja-products',JSON.stringify(items));
    function render(){ $('#products').innerHTML=items.length?items.map(p=>`<div class="product"><img src="${p.image}" alt=""><div><b>${p.name}</b><small>KSh ${Number(p.price).toLocaleString()} · ${p.category}</small></div><div><button onclick="edit('${p.id}')">Edit</button><button class="delete" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join(''):'<p>No furniture published yet.</p>' }
    function openNew(){ $('#form').reset();$('#id').value='';oldImage='';$('#formTitle').textContent='Add furniture';$('#modal').classList.add('show') }
    function edit(id){const p=items.find(x=>x.id===id);$('#id').value=p.id;$('#name').value=p.name;$('#price').value=p.price;$('#category').value=p.category;oldImage=p.image;$('#formTitle').textContent='Edit furniture';$('#modal').classList.add('show')}
    function removeProduct(id){if(confirm('Remove this furniture item?')){items=items.filter(p=>p.id!==id);save();render()}}
    async function cloudinary(file){if(!file)return oldImage;const data=new FormData();data.append('file',file);data.append('upload_preset','qejja-com');const r=await fetch('https://api.cloudinary.com/v1_1/dbyeox0j8/image/upload',{method:'POST',body:data}),j=await r.json();if(!r.ok)throw Error(j.error?.message||'Image upload failed');return j.secure_url}
    $('#loginForm').onsubmit=e=>{e.preventDefault();if($('#pass').value!=='qeja-admin'){$('#error').textContent='Incorrect passcode.';return}$('#login').style.display='none';$('#app').style.display='block';render()};$('#logout').onclick=()=>location.reload();$('#add').onclick=openNew;$('#close').onclick=()=>$('#modal').classList.remove('show');
    $('#form').onsubmit=async e=>{e.preventDefault();const btn=$('#publish');btn.disabled=true;btn.textContent='Uploading…';try{const image=await cloudinary($('#photo').files[0]);if(!image)throw Error('Choose a product photo.');const p={id:$('#id').value||`qeja-${Date.now()}`,name:$('#name').value,price:+$('#price').value,category:$('#category').value,image};const i=items.findIndex(x=>x.id===p.id);if(i<0)items.unshift(p);else items[i]=p;save();render();$('#modal').classList.remove('show')}catch(err){$('#uploadError').textContent=err.message}finally{btn.disabled=false;btn.textContent='Publish'}};
    const social=JSON.parse(localStorage.getItem('qeja-socials')||'{}');['instagram','facebook','tiktok'].forEach(k=>$('#'+k).value=social[k[0].toUpperCase()+k.slice(1)]||'');$('#saveSocial').onclick=()=>{localStorage.setItem('qeja-socials',JSON.stringify({Instagram:$('#instagram').value,Facebook:$('#facebook').value,TikTok:$('#tiktok').value}));$('#saveSocial').textContent='Saved ✓'};
  </script>
</body></html>
